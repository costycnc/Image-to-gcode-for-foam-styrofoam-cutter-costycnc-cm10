name: Genera EXE CostyCNC CM10

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Scarica il codice da GitHub
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa lo strumento di compilazione
        run: |
          npm install -g nw-builder

      - name: Genera il file package.json correttamente via Python
        run: |
          python -c "import json; data = {'name': 'CostyCNC-CM10', 'main': 'index.html', 'window': {'title': 'CostyCNC CM10 - Image to GCode', 'width': 1200, 'height': 800, 'icon': 'favicon.ico'}}; open('package.json', 'w', encoding='utf-8').write(json.dumps(data, indent=2))"

      - name: Compila il sito in un file EXE Windows (Fix Glob)
        run: |
          # Il parametro --glob=false risolve il bug del pacchetto non trovato su Windows
          nwbuild --platforms=win64 --flavor=normal --glob=false .

      - name: Salva il file EXE finale nei download
        uses: actions/upload-artifact@v4
        with:
          name: CostyCNC-CM10-Windows-EXE
          path: build/CostyCNC-CM10/win64/**/*
