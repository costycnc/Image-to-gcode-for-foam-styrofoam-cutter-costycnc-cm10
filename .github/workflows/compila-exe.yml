name: Genera EXE CostyCNC CM10

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Scarica il codice da GitHub
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa lo strumento di compilazione
        run: |
          npm install -g nw-builder

      - name: Genera il file package.json completo via Python
        run: |
          python -c "import json; data = {'name': 'costycnc-cm10', 'main': 'index.html', 'window': {'title': 'CostyCNC CM10 - Image to GCode', 'width': 1200, 'height': 800, 'icon': 'favicon.ico'}, 'nwbuild': {'platforms': ['win64'], 'flavor': 'normal', 'glob': False}}; open('package.json', 'w', encoding='utf-8').write(json.dumps(data, indent=2))"

      - name: Compila il sito in un file EXE Windows
        run: |
          # Avvia il build leggendo la configurazione 'nwbuild' inserita nel package.json
          nwbuild
