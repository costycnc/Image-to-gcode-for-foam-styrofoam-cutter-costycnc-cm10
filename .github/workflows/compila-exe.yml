name: Genera EXE CostyCNC CM10

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.yml'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Molto più veloce e stabile di Windows!

    steps:
      - name: Scarica il codice da GitHub
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa PKG (Convertitore HTML/JS in EXE)
        run: npm install -g pkg

      - name: Genera il file package.json di avvio
        run: |
          echo '{ "name": "CostyCNC-CM10", "version": "1.0.0", "main": "index.html", "bin": "index.html" }' > package.json

      - name: Compila il software in un file EXE Windows unico
        run: |
          # Compila direttamente per Windows a 64 bit da una macchina Linux!
          pkg . --targets node18-win-x64 --output CostyCNC_CM10.exe

      - name: Salva il file EXE finale nei download
        uses: actions/upload-artifact@v4
        with:
          name: CostyCNC-CM10-Windows-EXE
          path: ./CostyCNC_CM10.exe
