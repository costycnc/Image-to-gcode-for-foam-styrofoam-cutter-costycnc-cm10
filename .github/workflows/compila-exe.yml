name: Genera EXE CostyCNC CM10

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.yml'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Torniamo su Windows ma con uno strumento nativo diverso

    steps:
      - name: Scarica il codice da GitHub
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa lo strumento Nativefier
        run: |
          npm install -g nativefier

      - name: Compila HTML e JS in una App EXE Autonoma
        run: |
          # Questo comando prende la tua cartella attuale e la trasforma in una vera app Windows (.exe)
          nativefier --name "CostyCNC_CM10" --platform "windows" --arch "x64" --single-instance "."

      - name: Salva il file EXE finale nei download
        uses: actions/upload-artifact@v4
        with:
          name: CostyCNC-CM10-Windows-App
          path: CostyCNC_CM10-win32-x64/**/*
